insmod all_video
set timeout=4
set default=0

menuentry "S12 Linux" {
	linux /boot/linux rdinit=/sbin/init quiet
	initrd /boot/initramfs.xz
}

menuentry "S12 Linux (text console)" {
	linux /boot/linux rdinit=/sbin/textinit quiet
	initrd /boot/initramfs.xz
}

menuentry "S12 Linux (safe graphics: BIOS framebuffer, no GMA driver)" {
	set gfxpayload=keep
	linux /boot/linux rdinit=/sbin/init quiet nomodeset
	initrd /boot/initramfs.xz
}

menuentry "S12 Linux (debug: all kernel messages, one processor thread)" {
	linux /boot/linux rdinit=/sbin/textinit ignore_loglevel maxcpus=1
	initrd /boot/initramfs.xz
}
