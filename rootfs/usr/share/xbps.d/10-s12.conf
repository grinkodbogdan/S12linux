# XBPS settings for S12 Linux. Files in /etc/xbps.d with the same name override these.

# The architecture of the S12's Atom N270: Void's 32-bit packages (glibc)
architecture=i686

# Packages S12 Linux provides itself (kernel, init, base files), or that do not apply to a
# system running from RAM. Dependencies on them are considered satisfied.
ignorepkg=base-files
ignorepkg=base-system
ignorepkg=linux
ignorepkg=linux-base
ignorepkg=linux-firmware
ignorepkg=linux-firmware-network
ignorepkg=runit
ignorepkg=runit-void
ignorepkg=dracut
ignorepkg=grub
ignorepkg=grub-i386-efi
ignorepkg=grub-x86_64-efi

# Files of S12 Linux that packages must not replace
preserve=/etc/rc
preserve=/etc/profile
preserve=/etc/hostname
preserve=/etc/hosts
preserve=/etc/wpa_supplicant.conf
preserve=/usr/bin/init

# Keep the configuration files changed by hand when a package is updated
keepconf=true
